<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Cairo;src:url(fonts/cairo-400.ttf);font-weight:400}
@font-face{font-family:Cairo;src:url(fonts/cairo-700.ttf);font-weight:700}
@font-face{font-family:Cairo;src:url(fonts/cairo-900.ttf);font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0A1A33}
body{font-family:Cairo,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;
  background:linear-gradient(168deg,#0A1A33 0%,#0C2044 55%,#08202E 100%)}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
#g1{width:900px;height:900px;background:#1D3E70;top:-260px;left:-220px}
#g2{width:820px;height:820px;background:#164A47;bottom:-240px;right:-200px}
.grain{position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.09) 1px, transparent 0);
  background-size:30px 30px}
#ring{position:absolute;width:1300px;height:1300px;border-radius:50%;
  border:2px solid rgba(240,180,41,.22);top:310px;left:-110px}
#bar{position:absolute;top:0;right:0;height:8px;background:#F0B429;z-index:9}
#mark{position:absolute;top:74px;right:72px;display:flex;align-items:center;gap:16px;
  color:#fff;font-weight:700;font-size:30px;letter-spacing:.28em;z-index:8}
#mark i{width:18px;height:18px;border-radius:50%;background:#F0B429;display:block}
#site{position:absolute;bottom:78px;right:0;left:0;text-align:center;color:#9FB6D6;
  font-size:34px;font-weight:700;direction:ltr;z-index:8}
.beat{position:absolute;right:96px;left:96px;text-align:right;will-change:transform,opacity}
.big{font-size:118px;font-weight:900;line-height:1.32;color:#fff;letter-spacing:-.02em}
.big em{font-style:normal;color:#F0B429}
.big.mint em{color:#3FBF9A}
.mid{font-size:82px;font-weight:900;line-height:1.36;color:#fff}
.mid em{font-style:normal;color:#E4574C}
.sub{font-size:52px;font-weight:700;line-height:1.5;color:#C6D6EC;margin-top:26px}
.row{display:flex;align-items:center;gap:30px;justify-content:flex-start}
.n{flex:none;width:92px;height:92px;border-radius:26px;background:#3FBF9A;color:#08202E;
  font-size:50px;font-weight:900;display:flex;align-items:center;justify-content:center}
.x{flex:none;width:80px;height:80px;border-radius:24px;background:rgba(228,87,76,.18);
  color:#E4574C;font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center}
.rt{font-size:66px;font-weight:700;color:#fff;line-height:1.4}
#cta{font-size:150px;font-weight:900;color:#F0B429;line-height:1.3;text-align:center}
#ctas{font-size:56px;font-weight:700;color:#fff;text-align:center;margin-top:24px;direction:ltr}
</style></head><body>
<div id="stage">
  <div class="glow" id="g1"></div><div class="glow" id="g2"></div>
  <div id="ring"></div><div class="grain"></div>
  <div id="mark"><i></i>NARA ABROAD</div>
  <div id="bar"></div>
  <div id="site">nara-abroad.co.uk</div>
  <div id="layer"></div>
</div>
<script>
const DUR = 27;
const B = [
 // t0, t1, html, y-offset   — timings follow the voice-over
 [0.30, 3.85, `<div class="big">بدك تدرس<br><em>برّا؟</em></div>`],
 [1.60, 3.85, `<div class="sub">وما بتعرف من وين تبلّش…</div>`, 330],
 [4.00, 10.20, `<div class="mid">التقديم لحاله<br><em>متاهة.</em></div>`, -430],
 [5.55, 10.20, `<div class="row"><div class="x">✕</div><div class="rt">كل جامعة نظام مختلف</div></div>`, -60],
 [6.95, 10.20, `<div class="row"><div class="x">✕</div><div class="rt">مواعيد بتفوتك</div></div>`, 110],
 [8.35, 10.20, `<div class="row"><div class="x">✕</div><div class="rt">أوراق بترجع مرفوضة</div></div>`, 280],
 [10.45, 12.75, `<div class="big mint" style="text-align:center">في طريقة<br><em>أسهل.</em></div>`],
 [12.95, 22.60, `<div class="row"><div class="n">١</div><div class="rt">ملف طالب واحد<br>بتبنيه مرة وحدة</div></div>`, -380],
 [16.10, 22.60, `<div class="row"><div class="n">٢</div><div class="rt">ترشيح حسب درجاتك<br>وأهدافك</div></div>`, -90],
 [19.30, 22.60, `<div class="row"><div class="n">٣</div><div class="rt">تقدّم لـ ٣ برامج<br>من نفس الشاشة</div></div>`, 200],
 [22.90, 27.0, `<div id="cta">ابدأ اليوم.</div><div id="ctas">nara-abroad.co.uk</div>`],
];
const layer = document.getElementById('layer');
const els = B.map(b => {
  const d = document.createElement('div');
  d.className = 'beat'; d.innerHTML = b[2];
  d.style.top = (960 + (b[3] || 0)) + 'px';
  d.style.transform = 'translateY(0)';
  layer.appendChild(d);
  // vertically centre each beat on its anchor
  d.style.marginTop = (-d.offsetHeight / 2) + 'px';
  return d;
});
const easeOut = p => 1 - Math.pow(1 - p, 3);
const clamp = v => Math.max(0, Math.min(1, v));

window.render = function (t) {
  document.getElementById('bar').style.width = (t / DUR * 1080) + 'px';
  document.getElementById('ring').style.transform = `rotate(${t * 5}deg)`;
  document.getElementById('g1').style.transform = `translate(${Math.sin(t*.7)*40}px,${Math.cos(t*.5)*30}px)`;
  document.getElementById('g2').style.transform = `translate(${Math.cos(t*.6)*45}px,${Math.sin(t*.8)*35}px)`;
  B.forEach((b, i) => {
    const [t0, t1] = b, el = els[i];
    const IN = 0.42, OUT = 0.30;
    if (t < t0 - 0.02 || t > t1 + OUT) { el.style.opacity = 0; return; }
    const pin = easeOut(clamp((t - t0) / IN));
    const pout = clamp((t - t1) / OUT);
    const op = pin * (1 - pout);
    const y = (1 - pin) * 70 - pout * 45;
    const s = 0.955 + 0.045 * pin;
    el.style.opacity = op;
    el.style.transform = `translateY(${y}px) scale(${s})`;
  });
};
render(0);
</script></body></html>
