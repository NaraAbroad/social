<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
.card{background:
  radial-gradient(900px 620px at 92% 6%, #F6E2DE 0%, transparent 62%),
  linear-gradient(172deg,#FBF8F2 0%,#F3ECE1 100%);color:var(--ink)}
.grain{opacity:.6;background-image:radial-gradient(circle at 1px 1px, rgba(10,26,51,.07) 1px, transparent 0)}
.blob{position:absolute;width:760px;height:760px;border-radius:50%;
  border:2px dashed rgba(228,87,76,.28);top:-300px;left:-260px}
.tag{background:rgba(228,87,76,.12);color:var(--rose);border:1px solid rgba(228,87,76,.30)}
.wordmark{color:var(--ink)}
h1{font-size:92px;margin-bottom:10px}
h1 em{font-style:normal;color:var(--rose)}
.list{margin-top:46px;display:flex;flex-direction:column;gap:30px}
.item{display:flex;align-items:flex-start;gap:24px}
.x{flex:none;width:52px;height:52px;border-radius:16px;background:rgba(228,87,76,.12);
  color:var(--rose);font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;
  line-height:1;margin-top:4px}
.txt{font-size:36px;font-weight:600;line-height:1.5;color:#22344F}
.kicker{margin-top:62px;background:var(--ink);color:#fff;border-radius:24px;padding:34px 40px;
  font-size:34px;font-weight:700;line-height:1.5}
.kicker span{color:var(--gold)}
.foot{border-top:1px solid rgba(10,26,51,.16);color:#5A6E8C}
.foot b{color:var(--rose);font-weight:700}
</style></head><body>
<div class="card">
  <div class="grain"></div><div class="blob"></div>
  <div class="brand">
    <div class="wordmark"><span class="dot"></span>NARA ABROAD</div>
    <div class="tag">المشكلة</div>
  </div>
  <div class="body">
    <h1>التقديم للجامعات<br><em>متاهة.</em></h1>
    <div class="list">
      <div class="item"><div class="x">✕</div><div class="txt">كل جامعة عندها موقع وطلب ونظام مختلف</div></div>
      <div class="item"><div class="x">✕</div><div class="txt">مواعيد نهائية متفرقة… وحدة تفوتك تضيع السنة</div></div>
      <div class="item"><div class="x">✕</div><div class="txt">وسطاء يرشّحون لك الجامعة اللي تخدمهم هم</div></div>
      <div class="item"><div class="x">✕</div><div class="txt">طلب يُرفض بسبب تفصيل صغير بالأوراق</div></div>
    </div>
    <div class="kicker">النتيجة؟ <span>شهور تضيع</span> وأنت لا تدري إذا اخترت صح.</div>
  </div>
  <div class="foot"><span class="ltr">nara-abroad.co.uk</span><span><b class="ltr">@naraabroad_official</b></span></div>
</div></body></html>
