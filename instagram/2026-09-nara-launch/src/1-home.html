<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
.card{background:
  radial-gradient(1200px 700px at 88% -12%, #1D3E70 0%, transparent 60%),
  radial-gradient(900px 600px at 5% 108%, #14305C 0%, transparent 58%),
  linear-gradient(168deg,#0A1A33 0%,#0C2044 100%);color:#fff}
.arc{position:absolute;border-radius:50%;border:2px solid rgba(240,180,41,.30)}
.a1{width:1180px;height:1180px;top:-430px;left:-330px}
.a2{width:820px;height:820px;top:-250px;left:-150px;border-color:rgba(95,168,232,.20)}
.tag{background:rgba(240,180,41,.14);color:var(--gold);border:1px solid rgba(240,180,41,.32)}
h1{font-size:100px}
h1 em{font-style:normal;color:var(--gold)}
.sub{margin-top:38px;font-size:38px;line-height:1.6;font-weight:400;color:#C6D6EC;max-width:820px}
.stats{display:flex;gap:0;margin-top:78px;border-top:1px solid rgba(255,255,255,.16);padding-top:44px}
.stat{flex:1}
.stat + .stat{border-right:1px solid rgba(255,255,255,.16);padding-right:38px}
.stat:not(:last-child){padding-left:38px}
.num{font-size:72px;font-weight:900;color:#fff;line-height:1;letter-spacing:-.02em}
.lbl{margin-top:14px;font-size:26px;font-weight:600;color:#9FB6D6}
.foot{border-top:1px solid rgba(255,255,255,.16);color:#9FB6D6}
.foot b{color:var(--gold);font-weight:700}
</style></head><body>
<div class="card">
  <div class="grain"></div><div class="arc a1"></div><div class="arc a2"></div>
  <div class="brand">
    <div class="wordmark"><span class="dot"></span>NARA ABROAD</div>
    <div class="tag">ابدأ من هنا</div>
  </div>
  <div class="body">
    <h1>كل جامعات العالم<br><em>في شاشة واحدة.</em></h1>
    <p class="sub">قارن البرامج، اختر اللي يناسبك، وقدّم — من نفس المكان، بدون وسطاء ولا لفّة.</p>
    <div class="stats">
      <div class="stat"><div class="num">+50,000</div><div class="lbl">برنامج دراسي</div></div>
      <div class="stat"><div class="num">+600</div><div class="lbl">جامعة</div></div>
      <div class="stat"><div class="num">35</div><div class="lbl">دولة</div></div>
    </div>
  </div>
  <div class="foot"><span class="ltr">nara-abroad.co.uk</span><span><b class="ltr">@naraabroad_official</b></span></div>
</div></body></html>
